[workspace]
members = ["crates/gba-core", "crates/gba-headless", "crates/gba-host", "crates/gba-desktop"]
resolver = "3"

[workspace.package]
version = "0.3.1"
edition = "2024"
rust-version = "1.90"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"
unwrap_used = "warn"

[profile.release]
overflow-checks = true
lto = "thin"

# Keep release optimization and overflow behavior, adding symbols for Linux perf.
[profile.profiling]
inherits = "release"
debug = 2
strip = false
